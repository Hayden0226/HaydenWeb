name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3,9,15,21 * * *' # rebuild ~every 6h so music stats stay fresh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write .env from secrets
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> .env
          echo "LASTFM_USERNAME=${{ secrets.LASTFM_USERNAME }}" >> .env
          echo "GOODREADS_USER_ID=${{ secrets.GOODREADS_USER_ID || '203812556' }}" >> .env
          echo "LETTERBOXD_USERNAME=${{ secrets.LETTERBOXD_USERNAME || 'Hayden0325' }}" >> .env
          echo "TMDB_ACCESS_TOKEN=${{ secrets.TMDB_ACCESS_TOKEN }}" >> .env
          echo "TMDB_ACCOUNT_OBJECT_ID=${{ secrets.TMDB_ACCOUNT_OBJECT_ID }}" >> .env
          echo "TMDB_TV_LIST_ID=${{ secrets.TMDB_TV_LIST_ID }}" >> .env
          echo "ANILIST_USERNAME=${{ secrets.ANILIST_USERNAME || 'Hayden0325' }}" >> .env

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Build static site
        run: npx astro build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
